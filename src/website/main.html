<!DOCTYPE html>
<!-- HTML Template from https://www.w3schools.com/css/tryit.asp?filename=trycss_template3 -->
<html lang="en">

<head>
    <title>WorshipList</title>
    <!-- Favicon doesn't work -->
    <!-- <link rel="icon" type="image/x-icon" href="icon.ico"> -->
    <!-- <link rel="icon" type="image/x-icon" href="{{ url_for('main_page', filename='icon.ico') }}"> -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        /* Style the top navigation bar */
        .topnav {
            overflow: hidden;
            background-color: #333;
        }

        /* Style the topnav links */
        .topnav a {
            float: left;
            display: block;
            color: #f2f2f2;
            text-align: center;
            padding: 14px 16px;
            text-decoration: none;
        }

        /* Change color on hover */
        .topnav a:hover {
            background-color: #ddd;
            color: black;
        }

        /* Style the content */
        .content {
            background-color: #ddd;
            padding: 10px;
        }

        /* Style the footer */
        .footer {
            position: fixed;
            left: 0;
            bottom: 0;
            width: 100%;
            background-color: #f1f1f1;
            padding: 5px;
        }

        /* Style buttons */
        .btn {
            font-size: 15px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="topnav">
        <a href="#">Link</a>
        <a href="#">Link</a>
        <a href="#">Link</a>
    </div>

    <div class="content">
        <h2>WorshipList</h2>
        <p>This website automatically generates a chord chart for the songs being played
            on a given week at my church. The source code is open-source and can be found
            <a href="https://github.com/samm82/WorshipList">here</a>.
        </p>

        <form action="{{url_for('process')}}" method="post">
            <div style="float:left;margin-right:5px;">
                <label for="song0">Songs:</label><br>
                <select id="song0" name="song0" value=""></select><br>
                <select id="song1" name="song1" value=""></select><br>
                <select id="song2" name="song2" value=""></select><br>
                <select id="song3" name="song3" value=""></select><br>
            </div>
            <div style="float:left;margin-right:20px;">
                <label for="key0">Keys:</label><br>
                <input type="text" id="key0" name="key0" value=""><br>
                <input type="text" id="key1" name="key1" value=""><br>
                <input type="text" id="key2" name="key2" value=""><br>
                <input type="text" id="key3" name="key3" value=""><br>
            </div><br>

            <label for="filename">File name:</label><br>
            <input type="text" id="filename" name="filename" value=""><br><br>
            <div>
                <input class="btn" type="submit" name="btn_OK" value="OK">
                <input class="btn" type="submit" name="btn_Sun" value="Use Next Sunday">
            </div>
        </form>
    </div>

    <div class="footer">
        <p>© Samuel Crawford 2019. All rights reserved.</p>
    </div>

    <script>
        const songIDs = ['song0', 'song1', 'song2', 'song3'];
        const validSongs = JSON.parse({{ songs | tojson }})["songs"];

        songIDs.forEach(function (songSelect) {
            console.log(songSelect);
            var selectElement = document.getElementById(songSelect);

            validSongs.forEach(function (song) {
                var opt = document.createElement('option');
                opt.value = song;
                opt.innerHTML = song;
                selectElement.appendChild(opt);
            })

        });

        document.getElementById("filename").value = "{{ filenameVal }}";
        if (!{{ validFileName }}) { alert("Invalid file name. Try again."); }
    </script>

</body>

</html>
