<!DOCTYPE html>
<!-- HTML Template from https://www.w3schools.com/css/tryit.asp?filename=trycss_template3 -->
<html lang="en">

<head>
    <title>WorshipList</title>
    <!-- Favicon doesn't work -->
    <!-- <link rel="icon" type="image/x-icon" href="icon.ico"> -->
    <!-- <link rel="icon" type="image/x-icon" href="{{ url_for('main_page', filename='icon.ico') }}"> -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        /* Style the top navigation bar */
        .topnav {
            overflow: hidden;
            background-color: #333;
        }

        /* Style the topnav links */
        .topnav a {
            float: left;
            display: block;
            color: #f2f2f2;
            text-align: center;
            padding: 14px 16px;
            text-decoration: none;
        }

        /* Change color on hover */
        .topnav a:hover {
            background-color: #ddd;
            color: black;
        }

        /* Style the content */
        .content {
            background-color: #ddd;
            padding: 10px;
        }

        /* Style the footer */
        .footer {
            position: fixed;
            left: 0;
            bottom: 0;
            width: 100%;
            background-color: #f1f1f1;
            padding: 5px;
        }

        /* Style buttons */
        .btn {
            font-size: 15px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="topnav">
        <a href="#">Link</a>
        <a href="#">Link</a>
        <a href="#">Link</a>
    </div>

    <div class="content">
        <h2>WorshipList</h2>
        <p>This website automatically generates a chord chart for the songs being played
            on a given week at my church. The source code is open-source and can be found
            <a href="https://github.com/samm82/WorshipList">here</a>.
        </p>

        <form action="{{url_for('process_filename')}}" method="post">
            <label for="filename">File name:</label><br>
            <input type="text" id="filename" name="filename" value=""><br><br>
            <div>
                <input class="btn" type="submit" value="OK">
                <button class="btn">Use Next Sunday</button>
            </div>
        </form>
    </div>

    <div class="footer">
        <p>© Samuel Crawford 2019-2026. All rights reserved.</p>
    </div>

    <script>
        document.getElementById("filename").value = "{{ filenameVal }}";
        if (!{{ validFileName }}) { alert("Invalid file name. Try again."); }
    </script>

</body>

</html>
